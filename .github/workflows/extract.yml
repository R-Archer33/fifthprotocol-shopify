name: Extract Files
on: push
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o *.zip
      - run: rm -f *.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add .
          git commit -m "Extract theme folders"
          git push
