name: Unzip Theme

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip archive
        run: |
          unzip -o "theme_export_fifthprotocol-org-refresh_20OCT2026-0224am (1).zip"
          rm "theme_export_fifthprotocol-org-refresh_20OCT2026-0224am (1).zip"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract theme folders"
          git push
