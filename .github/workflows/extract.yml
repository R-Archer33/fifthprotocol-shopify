name: Extract Files
on: push
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip safely
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;
          find . -maxdepth 1 -name "*.zip" -exec rm {} \;
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add .
          git commit -m "Extract theme folders"
          git push
