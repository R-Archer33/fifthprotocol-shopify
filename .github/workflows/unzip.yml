name: Unzip Theme
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Theme File
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          find . -maxdepth 1 -name "*.zip" -exec rm {} \;
      - name: Commit Unzipped Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Automated Unzip of Theme"
          git push
